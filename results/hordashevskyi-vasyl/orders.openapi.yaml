openapi: 3.1.0
info:
  title: Kavohub Orders API
  version: 1.0.0
  description: Orders HTTP contract; errors use RFC 9457.
servers:
  - url: https://orders.kavohub.example
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      parameters: [{$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '200':
          description: Health status
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {type: string, enum: [ok, degraded]}}}
  /quotes:
    post:
      operationId: createQuote
      x-roles: [sales_manager]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteCreate'}
      responses:
        '201':
          description: Quote created
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Quote'}}}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /quotes/{id}:
    get:
      operationId: getQuote
      x-roles: [sales_manager, sales_head, director]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/ResourceId'}
      responses:
        '200':
          description: Quote
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Quote'}}}
        '404': {$ref: '#/components/responses/Problem'}
  /orders:
    get:
      operationId: listOrders
      x-roles: [sales_manager, sales_head, director, accountant]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Order page
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/OrderSummary'}}
                  page: {type: integer}
                  pageSize: {type: integer}
                  total: {type: integer}
    post:
      operationId: createOrder
      x-roles: [sales_manager]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: {type: string}
                quoteId: {type: [string, 'null']}
      responses:
        '201':
          description: Draft order created
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        '409': {$ref: '#/components/responses/Problem'}
  /orders/{id}:
    get:
      operationId: getOrder
      x-roles: [sales_manager, sales_head, director, accountant, svc-billing]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/ResourceId'}
      responses:
        '200':
          description: Order; svc-billing receives the financial snapshot
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        '404': {$ref: '#/components/responses/Problem'}
  /orders/{id}/lines:
    put:
      operationId: replaceOrderLines
      x-roles: [sales_manager]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/ResourceId'}
        - {name: If-Match, in: header, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines: {type: array, items: {$ref: '#/components/schemas/OrderLine'}}
      responses:
        '200':
          description: Lines replaced
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        '409': {$ref: '#/components/responses/Problem'}
  /orders/{id}/confirm:
    post:
      operationId: confirmOrder
      x-roles: [sales_manager]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/ResourceId'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '409': {$ref: '#/components/responses/Problem'}
  /orders/{id}/approve-discount:
    post:
      operationId: approveDiscount
      x-roles: [sales_head, director]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/ResourceId'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /orders/{id}/reject-discount:
    post:
      operationId: rejectDiscount
      x-roles: [sales_head, director]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/ResourceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string, minLength: 1}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '409': {$ref: '#/components/responses/Problem'}
  /orders/{id}/withdraw:
    post:
      operationId: withdrawDiscountRequest
      x-roles: [sales_manager]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/ResourceId'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '409': {$ref: '#/components/responses/Problem'}
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      x-roles: [sales_manager, sales_head]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/ResourceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string, minLength: 1}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '409': {$ref: '#/components/responses/Problem'}
  /prices:
    get:
      operationId: listPrices
      x-roles: [sales_manager, sales_head, director]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {name: accountId, in: query, schema: {type: string}}
        - {name: sku, in: query, schema: {type: string}}
      responses:
        '200':
          description: Applicable prices
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [sku, currency, unitPrice]
                  properties:
                    sku: {type: string}
                    currency: {type: string, enum: [UAH, EUR]}
                    unitPrice: {type: string}
                    validFrom: {type: string, format: date}
                    validTo: {type: [string, 'null'], format: date}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    ResourceId:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  headers:
    CorrelationId:
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 9457 problem
      headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Accepted:
      description: Accepted for asynchronous processing
      headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
      content:
        application/json:
          schema:
            type: object
            required: [operationId, status]
            properties:
              operationId: {type: string}
              status: {type: string, enum: [accepted, pending]}
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
      additionalProperties: true
    QuoteCreate:
      type: object
      required: [accountId, lines]
      properties:
        accountId: {type: string}
        lines: {type: array, minItems: 1, items: {$ref: '#/components/schemas/OrderLine'}}
        quoteDate: {type: string, format: date}
    Quote:
      type: object
      required: [quoteId, accountId, status, quoteDate, version]
      properties:
        quoteId: {type: string}
        accountId: {type: string}
        status: {type: string, enum: [draft, sent, expired, converted]}
        quoteDate: {type: string, format: date}
        rateSnapshot: {$ref: '#/components/schemas/RateSnapshot'}
        version: {type: integer}
    OrderLine:
      type: object
      required: [sku, qty, unitPrice, currency, discountPercent, vatRate]
      properties:
        sku: {type: string}
        qty: {type: string, pattern: '^[0-9]+(\\.[0-9]{1,3})?$'}
        unitPrice: {type: string}
        currency: {type: string, enum: [UAH, EUR]}
        discountPercent: {type: string}
        vatRate: {type: string}
    RateSnapshot:
      type: object
      required: [currency, rate, quoteDate, rateDate, direction, source, observedAt]
      properties:
        currency: {type: string, const: EUR}
        rate: {type: string}
        quoteDate: {type: string, format: date}
        rateDate: {type: string, format: date}
        direction: {type: string, const: UAH per 1 EUR}
        source: {type: string}
        observedAt: {type: string, format: date-time}
    Order:
      type: object
      required: [orderId, accountId, status, lines, version]
      properties:
        orderId: {type: string, pattern: '^ORD-[0-9]{4}-[0-9]{6}$'}
        accountId: {type: string}
        status: {type: string, enum: [draft, pending_approval, pending_reservation, confirmed, shipped, invoiced, paid, release_pending, cancelled]}
        lines: {type: array, items: {$ref: '#/components/schemas/OrderLine'}}
        version: {type: integer}
        currency: {type: string, enum: [UAH, EUR]}
        rateSnapshot: {$ref: '#/components/schemas/RateSnapshot'}
        totals:
          type: object
          properties:
            subtotal: {type: string}
            vat: {type: string}
            total: {type: string}
    OrderSummary:
      type: object
      required: [orderId, accountId, status]
      properties:
        orderId: {type: string}
        accountId: {type: string}
        status: {type: string}

